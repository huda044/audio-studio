services:
  audio-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio-studio
    restart: unless-stopped
    env_file:
      - .env.oracle
    ports:
      - "7860:7860"
    volumes:
      - ./data:/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7860/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
