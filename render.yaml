services:
  - type: web
    name: audio-studio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CLIENT_ORIGIN
        value: https://client-daax4042s-projects.vercel.app
      - key: MAX_UPLOAD_MB
        value: 250
      - key: INLINE_AUDIO_LIMIT_MB
        value: 8
      - key: YTDLP_FORCE_UPDATE
        value: true
      - key: YTDLP_PREFER_LOCAL
        value: false
      - key: YTDLP_ENABLE_SECTIONS
        value: true
      - key: YTDLP_ALT_CLIENT_FALLBACKS
        value: true
      - key: YTDLP_FORCE_IPV4
        value: true
      - key: YTDLP_LEGACY_SERVER_CONNECT
        value: false
      - key: YTDLP_NO_CHECK_CERTIFICATES
        value: false
      - key: YTDLP_SOCKET_TIMEOUT
        value: 15
      - key: YTDLP_RETRIES
        value: 2
      - key: YTDLP_FRAGMENT_RETRIES
        value: 2
      - key: YTDLP_EXTRACTOR_RETRIES
        value: 4
      - key: YTDLP_RETRY_SLEEP
        value: extractor:linear=1::4
      - key: YTDLP_CONCURRENT_FRAGMENTS
        value: 1
      - key: YOUTUBE_DOWNLOAD_ORDER
        value: direct-url,ytdl-core,yt-dlp
      - key: YTDLP_GET_URL_TIMEOUT_MS
        value: 45000
      - key: YTDLP_SECTION_TIMEOUT_MS
        value: 120000
      - key: YTDLP_DOWNLOAD_TIMEOUT_MS
        value: 90000
      - key: DATA_STORE_NAMESPACE
        value: audio-studio
      - key: DATA_STORE_TABLE
        value: audio_studio_kv
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SECRETS_MASTER_KEY
        sync: false
      - key: ADMIN_BOOTSTRAP_USERNAME
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
